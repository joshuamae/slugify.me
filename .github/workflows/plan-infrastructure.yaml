name: Plan infrastructure

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    outputs:
      artifact-id:
        value: ${{ jobs.plan.outputs.artifact-id }}
      sha256:
        value: ${{ jobs.plan.outputs.sha256 }}

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}-plan
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SITE_ENVIRONMENT: ${{ inputs.environment }}
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      sha256: ${{ steps.plan.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Obtain planning credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: plan-${{ inputs.environment }}-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Create and inspect change sets from this commit
        id: plan
        run: |
          python3 -B scripts/deploy-infrastructure.py plan \
            --environment "$SITE_ENVIRONMENT" --plan "$RUNNER_TEMP/infra-plan/plan.json"
      - name: Save immutable reviewed plan
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infrastructure-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infra-plan/plan.json
          if-no-files-found: error
          retention-days: 7
