name: Publish site

on:
  workflow_call:
    inputs:
      environment:
        description: Target GitHub environment (staging or production)
        required: true
        type: string
      release-id:
        description: Selected release ID
        required: true
        type: string
      source:
        description: artifact for promotion, s3 for rollback
        default: artifact
        type: string
      artifact-id:
        description: Immutable artifact ID from this workflow run
        default: ""
        type: string
      manifest-sha256:
        description: Manifest checksum from the build job
        default: ""
        type: string
      recover-operation:
        description: Exact pending operation ID, only after confirming its process stopped
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish and verify ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_URL }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PAGER: ""
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_ENVIRONMENT: ${{ inputs.environment }}
      SITE_RELEASE_ID: ${{ inputs.release-id }}
      SITE_SOURCE: ${{ inputs.source }}
      SITE_ARTIFACT_ID: ${{ inputs.artifact-id }}
      SITE_MANIFEST_SHA256: ${{ inputs.manifest-sha256 }}
      SITE_RECOVER_OPERATION: ${{ inputs.recover-operation }}

    steps:
      - name: Check environment settings
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          case "$SITE_ENVIRONMENT" in
            staging | production) ;;
            *) printf '::error::Unsupported environment: %s\n' "$SITE_ENVIRONMENT"; exit 1 ;;
          esac
          for setting in AWS_REGION AWS_ROLE_ARN S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID SITE_URL; do
            if [[ -z "${!setting}" ]]; then
              printf '::error::Missing deployment environment variable: %s\n' "$setting"
              exit 1
            fi
          done
          [[ "$SITE_RELEASE_ID" =~ ^[0-9a-f]{12}-([0-9]+-[0-9]+|[0-9]{8}T[0-9]{6}Z)$ ]]
          case "$SITE_SOURCE" in
            artifact)
              [[ "$SITE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
              [[ "$SITE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
              ;;
            s3) ;;
            *) printf '::error::Unsupported release source\n'; exit 1 ;;
          esac

      - name: Check out release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Download build artifact
        if: inputs.source == 'artifact'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: ${{ runner.temp }}/release/

      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Publish selected release and verify every file
        run: |
          arguments=(--release-id "$SITE_RELEASE_ID" --output "$RUNNER_TEMP/release-verification.json")
          if [[ -n "$SITE_RECOVER_OPERATION" ]]; then
            arguments+=(--recover-operation "$SITE_RECOVER_OPERATION")
          fi
          if [[ "$SITE_SOURCE" == artifact ]]; then
            node scripts/site-release.mjs publish "${arguments[@]}" \
              --directory "$RUNNER_TEMP/release" --manifest-sha256 "$SITE_MANIFEST_SHA256"
          else
            node scripts/site-release.mjs rollback "${arguments[@]}"
          fi

      - name: Save HTTP verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-verification.json
          if-no-files-found: ignore
          retention-days: 30
