name: Publish site

on:
  workflow_call:
    inputs:
      environment:
        description: Target GitHub environment (staging or production)
        required: true
        type: string
      release-id:
        description: Selected release ID
        required: true
        type: string
      source:
        description: artifact for promotion, s3 for rollback
        default: artifact
        type: string
      artifact-id:
        description: Immutable artifact ID from this workflow run
        default: ""
        type: string
      manifest-sha256:
        description: Manifest checksum from the build job
        default: ""
        type: string
      recover-operation:
        description: Exact pending operation ID, only after confirming its process stopped
        default: ""
        type: string
      infrastructure-artifact-id:
        description: Immutable plan artifact; empty for application-only rollback
        default: ""
        type: string
      infrastructure-sha256:
        description: Plan checksum emitted by the planning job
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish and verify ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Three stack updates (105 minutes), infrastructure verification, and publishing
    timeout-minutes: 180
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_URL }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PAGER: ""
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_ENVIRONMENT: ${{ inputs.environment }}
      SITE_RELEASE_ID: ${{ inputs.release-id }}
      SITE_SOURCE: ${{ inputs.source }}
      SITE_ARTIFACT_ID: ${{ inputs.artifact-id }}
      SITE_MANIFEST_SHA256: ${{ inputs.manifest-sha256 }}
      SITE_RECOVER_OPERATION: ${{ inputs.recover-operation }}
      SITE_INFRA_ARTIFACT_ID: ${{ inputs.infrastructure-artifact-id }}
      SITE_INFRA_SHA256: ${{ inputs.infrastructure-sha256 }}

    steps:
      - name: Check environment settings
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          STAGING_BASIC_AUTH: ${{ inputs.environment == 'staging' && secrets.STAGING_BASIC_AUTH || '' }}
        run: |
          case "$SITE_ENVIRONMENT" in
            staging | production) ;;
            *) printf '::error::Unsupported environment: %s\n' "$SITE_ENVIRONMENT"; exit 1 ;;
          esac
          for setting in AWS_REGION AWS_ROLE_ARN S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID SITE_URL; do
            if [[ -z "${!setting}" ]]; then
              printf '::error::Missing deployment environment variable: %s\n' "$setting"
              exit 1
            fi
          done
          if [[ "$SITE_ENVIRONMENT" == staging && -z "$STAGING_BASIC_AUTH" ]]; then
            printf '::error::Missing staging environment secret: STAGING_BASIC_AUTH\n'
            exit 1
          fi
          [[ "$SITE_RELEASE_ID" =~ ^[0-9a-f]{12}-([0-9]+-[0-9]+|[0-9]{8}T[0-9]{6}Z)$ ]]
          case "$SITE_SOURCE" in
            artifact)
              [[ "$SITE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
              [[ "$SITE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
              ;;
            s3) ;;
            *) printf '::error::Unsupported release source\n'; exit 1 ;;
          esac
          if [[ -n "$SITE_INFRA_ARTIFACT_ID" ]]; then
            [[ "$SITE_SOURCE" == artifact ]]
            [[ "$SITE_INFRA_ARTIFACT_ID" =~ ^[0-9]+$ ]]
            [[ "$SITE_INFRA_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Check out release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Download build artifact
        if: inputs.source == 'artifact'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: ${{ runner.temp }}/release/

      - name: Obtain temporary AWS credentials
        if: inputs.infrastructure-artifact-id == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Download reviewed infrastructure plan
        if: inputs.infrastructure-artifact-id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ inputs.infrastructure-artifact-id }}
          path: ${{ runner.temp }}/infra-plan/

      - name: Obtain infrastructure execution credentials after environment approval
        if: inputs.infrastructure-artifact-id != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_INFRA_EXECUTION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: infra-${{ inputs.environment }}-${{ github.run_id }}
          role-duration-seconds: 10800
          mask-aws-account-id: true

      - name: Apply reviewed infrastructure and verify stack outputs
        if: inputs.infrastructure-artifact-id != ''
        run: |
          python3 -B scripts/deploy-infrastructure.py apply \
            --environment "$SITE_ENVIRONMENT" --plan "$RUNNER_TEMP/infra-plan/plan.json" \
            --sha256 "$SITE_INFRA_SHA256"
          python3 -B scripts/verify-infrastructure.py

      - name: Obtain fresh website publishing credentials
        if: inputs.infrastructure-artifact-id != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.SITE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: publish-${{ inputs.environment }}-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          mask-aws-account-id: true

      - name: Verify current website against the updated infrastructure
        if: inputs.infrastructure-artifact-id != ''
        env:
          STAGING_BASIC_AUTH: ${{ inputs.environment == 'staging' && secrets.STAGING_BASIC_AUTH || '' }}
        run: |
          node scripts/site-release.mjs state --output "$RUNNER_TEMP/active-release.json"
          release_id="$(node -e 'const s=require(process.argv[1]); if(s.pending || !s.active) process.exit(1); console.log(s.active.releaseId)' "$RUNNER_TEMP/active-release.json")"
          manifest_sha="$(node -p 'require(process.argv[1]).active.manifestSha256' "$RUNNER_TEMP/active-release.json")"
          node scripts/site-release.mjs verify --release-id "$release_id" \
            --manifest-sha256 "$manifest_sha" --output "$RUNNER_TEMP/infrastructure-verification.json"

      - name: Publish selected release and verify every file
        env:
          STAGING_BASIC_AUTH: ${{ inputs.environment == 'staging' && secrets.STAGING_BASIC_AUTH || '' }}
        run: |
          arguments=(--release-id "$SITE_RELEASE_ID" --output "$RUNNER_TEMP/release-verification.json")
          if [[ -n "$SITE_RECOVER_OPERATION" ]]; then
            arguments+=(--recover-operation "$SITE_RECOVER_OPERATION")
          fi
          if [[ "$SITE_SOURCE" == artifact ]]; then
            node scripts/site-release.mjs publish "${arguments[@]}" \
              --directory "$RUNNER_TEMP/release" --manifest-sha256 "$SITE_MANIFEST_SHA256"
          else
            node scripts/site-release.mjs rollback "${arguments[@]}"
          fi

      - name: Save HTTP verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-verification.json
            ${{ runner.temp }}/infrastructure-verification.json
          if-no-files-found: ignore
          retention-days: 30
