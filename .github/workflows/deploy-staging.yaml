name: Deploy staging and production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize the whole promotion, including approval; never interrupt uploads.
concurrency:
  group: aws-staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Check and package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
      archive-sha256: ${{ steps.release.outputs.archive-sha256 }}
      manifest-sha256: ${{ steps.release.outputs.manifest-sha256 }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Package release
        id: release
        run: |
          test -s build/client/index.html
          SITE_RELEASE_ID="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SITE_RELEASE_CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/site-release.mjs package \
            --source build/client --directory "$RUNNER_TEMP/release" \
            --release-id "$SITE_RELEASE_ID" --commit-sha "$GITHUB_SHA" \
            --created-at "$SITE_RELEASE_CREATED_AT" \
            --output "$RUNNER_TEMP/release-info.json"
          archive_sha256="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1])).archiveSha256' "$RUNNER_TEMP/release-info.json")" || exit 1
          manifest_sha256="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1])).manifestSha256' "$RUNNER_TEMP/release-info.json")" || exit 1
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          printf 'archive-sha256=%s\n' "$archive_sha256" >> "$GITHUB_OUTPUT"
          printf 'manifest-sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"
          printf 'release-id=%s\n' "$SITE_RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Save build artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-${{ steps.release.outputs.release-id }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  staging:
    name: Publish and verify staging
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-site.yaml
    secrets: inherit
    with:
      environment: staging
      release-id: ${{ needs.build.outputs.release-id }}
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      manifest-sha256: ${{ needs.build.outputs.manifest-sha256 }}

  production:
    name: Publish and verify production
    needs: [build, staging]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-site.yaml
    with:
      environment: production
      release-id: ${{ needs.build.outputs.release-id }}
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      manifest-sha256: ${{ needs.build.outputs.manifest-sha256 }}
