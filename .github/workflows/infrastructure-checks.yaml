name: Infrastructure checks

on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run the shared local and CI validators
        run: sh scripts/check-infrastructure.sh
