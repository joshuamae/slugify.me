# Guard the narrow DescribeEvents exception without granting broader deployment access
# Anchors reuse complete values so each invalid case isolates a permission regression

- name: Shared inspection allows only existing stack reads and regional event reads
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: &deployment_roles [{ Ref: Planner }, { Ref: Executor }]
                  PolicyDocument:
                      Statement:
                          - &stack_reads
                            Effect: Allow
                            Action:
                                - cloudformation:DescribeStacks
                                - cloudformation:DescribeChangeSet
                                - cloudformation:ListStackResources
                                - cloudformation:GetTemplate
                            Resource: { Ref: StackArns }
                          - &event_read
                            Sid: ReadDeploymentEvents
                            Effect: Allow
                            Action: cloudformation:DescribeEvents
                            Resource: '*'
                            Condition: &requested_region
                                StringEquals:
                                    aws:RequestedRegion: { Ref: 'AWS::Region' }
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: PASS
          shared_inspection_keeps_existing_stack_scope: PASS

- name: Event reads reject a missing region condition
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: *deployment_roles
                  PolicyDocument:
                      Statement:
                          - *stack_reads
                          - Sid: ReadDeploymentEvents
                            Effect: Allow
                            Action: cloudformation:DescribeEvents
                            Resource: '*'
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: FAIL
          shared_inspection_keeps_existing_stack_scope: FAIL

- name: Event reads reject wildcard region matching
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: *deployment_roles
                  PolicyDocument:
                      Statement:
                          - *stack_reads
                          - Sid: ReadDeploymentEvents
                            Effect: Allow
                            Action: cloudformation:DescribeEvents
                            Resource: '*'
                            Condition:
                                StringLike:
                                    aws:RequestedRegion: '*'
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: FAIL
          shared_inspection_keeps_existing_stack_scope: FAIL

- name: Event reads reject a different or additional region
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: *deployment_roles
                  PolicyDocument:
                      Statement:
                          - *stack_reads
                          - Sid: ReadDeploymentEvents
                            Effect: Allow
                            Action: cloudformation:DescribeEvents
                            Resource: '*'
                            Condition:
                                StringEquals:
                                    aws:RequestedRegion:
                                        [{ Ref: 'AWS::Region' }, us-west-2]
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: FAIL
          shared_inspection_keeps_existing_stack_scope: FAIL

- name: Event reads reject optional region conditions
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: *deployment_roles
                  PolicyDocument:
                      Statement:
                          - *stack_reads
                          - Sid: ReadDeploymentEvents
                            Effect: Allow
                            Action: cloudformation:DescribeEvents
                            Resource: '*'
                            Condition:
                                StringEqualsIfExists:
                                    aws:RequestedRegion: { Ref: 'AWS::Region' }
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: FAIL
          shared_inspection_keeps_existing_stack_scope: FAIL

- name: Event reads reject write actions on wildcard resources
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: *deployment_roles
                  PolicyDocument:
                      Statement:
                          - *stack_reads
                          - Sid: ReadDeploymentEvents
                            Effect: Allow
                            Action:
                                [
                                    cloudformation:DescribeEvents,
                                    cloudformation:ExecuteChangeSet,
                                ]
                            Resource: '*'
                            Condition: *requested_region
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: FAIL
          shared_inspection_keeps_existing_stack_scope: FAIL

- name: Event reads reject wildcard actions
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: *deployment_roles
                  PolicyDocument:
                      Statement:
                          - *stack_reads
                          - Sid: ReadDeploymentEvents
                            Effect: Allow
                            Action: 'cloudformation:*'
                            Resource: '*'
                            Condition: *requested_region
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: FAIL
          shared_inspection_keeps_existing_stack_scope: FAIL

- name: Missing event reads fail instead of skipping the rule
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: *deployment_roles
                  PolicyDocument:
                      Statement: [*stack_reads]
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: FAIL
          shared_inspection_keeps_existing_stack_scope: PASS

- name: An extra unrestricted statement cannot bypass the dedicated exception
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: *deployment_roles
                  PolicyDocument:
                      Statement:
                          - *stack_reads
                          - *event_read
                          - Effect: Allow
                            Action: cloudformation:DescribeEvents
                            Resource: '*'
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: PASS
          shared_inspection_keeps_existing_stack_scope: FAIL

- name: Existing stack inspection reads cannot use wildcard resources
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: *deployment_roles
                  PolicyDocument:
                      Statement:
                          - Effect: Allow
                            Action:
                                - cloudformation:DescribeStacks
                                - cloudformation:DescribeChangeSet
                                - cloudformation:ListStackResources
                                - cloudformation:GetTemplate
                            Resource: '*'
                          - *event_read
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: PASS
          shared_inspection_keeps_existing_stack_scope: FAIL

- name: Existing stack inspection cannot acquire write permissions
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: *deployment_roles
                  PolicyDocument:
                      Statement:
                          - Effect: Allow
                            Action:
                                - cloudformation:DescribeStacks
                                - cloudformation:DescribeChangeSet
                                - cloudformation:ListStackResources
                                - cloudformation:GetTemplate
                                - cloudformation:UpdateStack
                            Resource: { Ref: StackArns }
                          - *event_read
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: PASS
          shared_inspection_keeps_existing_stack_scope: FAIL

- name: Existing stack reads must remain available to the deployment workflow
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: *deployment_roles
                  PolicyDocument:
                      Statement: [*event_read]
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: PASS
          shared_inspection_keeps_existing_stack_scope: FAIL

- name: Shared inspection cannot be attached to an unrelated role
  input:
      Resources:
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: [{ Ref: Planner }, { Ref: Executor }, unrelated-role]
                  PolicyDocument:
                      Statement: [*stack_reads, *event_read]
  expectations:
      rules:
          deployment_events_only_allow_region_limited_reads: PASS
          shared_inspection_keeps_existing_stack_scope: FAIL

- name: Planner cleanup only deletes pre-merge change sets on existing stacks
  input:
      Resources:
          Planner:
              Properties:
                  Policies:
                      - PolicyName: PrepareExistingStacks
                        PolicyDocument:
                            Statement:
                                - Sid: CleanupPreMergeChangeSets
                                  Effect: Allow
                                  Action: cloudformation:DeleteChangeSet
                                  Resource: { Ref: StackArns }
                                  Condition: &pre_merge_names
                                      StringLike:
                                          cloudformation:ChangeSetName:
                                              - Fn::Sub: 'premerge-${Environment}-*'
                                              - Fn::Sub: 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/premerge-${Environment}-*/*'
  expectations:
      rules:
          planner_cleanup_only_deletes_pre_merge_change_sets: PASS

- name: Planner cleanup rejects a missing permission instead of skipping
  input:
      Resources:
          Planner:
              Properties:
                  Policies:
                      - PolicyName: PrepareExistingStacks
                        PolicyDocument:
                            Statement: []
  expectations:
      rules:
          planner_cleanup_only_deletes_pre_merge_change_sets: FAIL

- name: Planner cleanup cannot delete reviewed deployment change sets
  input:
      Resources:
          Planner:
              Properties:
                  Policies:
                      - PolicyName: PrepareExistingStacks
                        PolicyDocument:
                            Statement:
                                - Sid: CleanupPreMergeChangeSets
                                  Effect: Allow
                                  Action: cloudformation:DeleteChangeSet
                                  Resource: { Ref: StackArns }
                                  Condition:
                                      StringLike:
                                          cloudformation:ChangeSetName:
                                              - Fn::Sub: 'github-${Environment}-*'
                                              - Fn::Sub: 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/github-${Environment}-*/*'
  expectations:
      rules:
          planner_cleanup_only_deletes_pre_merge_change_sets: FAIL

- name: Planner cleanup cannot acquire execution permissions
  input:
      Resources:
          Planner:
              Properties:
                  Policies:
                      - PolicyName: PrepareExistingStacks
                        PolicyDocument:
                            Statement:
                                - Sid: CleanupPreMergeChangeSets
                                  Effect: Allow
                                  Action:
                                      - cloudformation:DeleteChangeSet
                                      - cloudformation:ExecuteChangeSet
                                  Resource: { Ref: StackArns }
                                  Condition: *pre_merge_names
  expectations:
      rules:
          planner_cleanup_only_deletes_pre_merge_change_sets: FAIL

- name: Executor runs only deployment change sets
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement:
                                - &executor_change_sets
                                  Effect: Allow
                                  Action:
                                      - cloudformation:ExecuteChangeSet
                                      - cloudformation:DeleteChangeSet
                                  Resource: { Ref: StackArns }
                                  Condition:
                                      StringLike:
                                          cloudformation:ChangeSetName:
                                              - Fn::Sub: 'github-${Environment}-*'
                                              - Fn::Sub: 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/github-${Environment}-*/*'
                                - Effect: Allow
                                  Action: [s3:ListBucket, iam:GetRole]
                                  Resource: { Ref: ResourceArns }
                                - Fn::If:
                                      - HasStagingAuthSecret
                                      - Effect: Allow
                                        Action: secretsmanager:GetSecretValue
                                        Resource: { Ref: StagingAuthSecretArn }
                                      - Ref: AWS::NoValue
                                - Effect: Allow
                                  Action: route53:GetChange
                                  Resource: 'arn:aws:route53:::change/*'
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: PASS

- name: Executor cannot run pre-merge change sets
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement:
                                - Effect: Allow
                                  Action:
                                      - cloudformation:ExecuteChangeSet
                                      - cloudformation:DeleteChangeSet
                                  Resource: { Ref: StackArns }
                                  Condition:
                                      StringLike:
                                          cloudformation:ChangeSetName:
                                              - Fn::Sub: 'github-${Environment}-*'
                                              - Fn::Sub: 'premerge-${Environment}-*'
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Executor change-set names cannot use a wildcard
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement:
                                - Effect: Allow
                                  Action:
                                      - cloudformation:ExecuteChangeSet
                                      - cloudformation:DeleteChangeSet
                                  Resource: { Ref: StackArns }
                                  Condition:
                                      StringLike:
                                          cloudformation:ChangeSetName: '*'
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Executor cannot add a separate unrestricted execution statement
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement:
                                - *executor_change_sets
                                - Effect: Allow
                                  Action: cloudformation:ExecuteChangeSet
                                  Resource: { Ref: StackArns }
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Executor cannot receive wildcard actions
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement:
                                - *executor_change_sets
                                - Effect: Allow
                                  Action: '*'
                                  Resource: { Ref: StackArns }
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Missing executor change-set permissions fail instead of skipping
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement:
                                - Effect: Allow
                                  Action: route53:GetChange
                                  Resource: 'arn:aws:route53:::change/*'
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Planner may prepare deployment and pre-merge change sets
  input:
      Resources:
          Planner:
              Properties:
                  Policies:
                      - PolicyName: PrepareExistingStacks
                        PolicyDocument:
                            Statement:
                                - &planner_validate
                                  Effect: Allow
                                  Action: cloudformation:ValidateTemplate
                                  Resource: '*'
                                - &planner_create
                                  Effect: Allow
                                  Action: cloudformation:CreateChangeSet
                                  Resource: { Ref: StackArns }
                                  Condition:
                                      StringLike:
                                          cloudformation:ChangeSetName:
                                              - Fn::Sub: 'github-${Environment}-*'
                                              - Fn::Sub: 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/github-${Environment}-*/*'
                                              - Fn::Sub: 'premerge-${Environment}-*'
                                              - Fn::Sub: 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/premerge-${Environment}-*/*'
                                      'Null':
                                          cloudformation:RoleArn: 'true'
                                - &planner_cleanup
                                  Sid: CleanupPreMergeChangeSets
                                  Effect: Allow
                                  Action: cloudformation:DeleteChangeSet
                                  Resource: { Ref: StackArns }
                                  Condition: *pre_merge_names
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: [{ Ref: Planner }, { Ref: Executor }]
                  PolicyDocument:
                      Statement: [*stack_reads, *event_read]
  expectations:
      rules:
          planner_cleanup_only_deletes_pre_merge_change_sets: PASS
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Planner cannot add execution through a statement with another Sid
  input:
      Resources:
          Planner:
              Properties:
                  Policies:
                      - PolicyName: PrepareExistingStacks
                        PolicyDocument:
                            Statement:
                                - *planner_validate
                                - *planner_create
                                - *planner_cleanup
                                - Sid: PrepareMore
                                  Effect: Allow
                                  Action: cloudformation:ExecuteChangeSet
                                  Resource: { Ref: StackArns }
  expectations:
      rules:
          planner_cleanup_only_deletes_pre_merge_change_sets: FAIL

- name: Planner cannot delete deployment change sets through a second inline policy
  input:
      Resources:
          Planner:
              Properties:
                  Policies:
                      - PolicyName: PrepareExistingStacks
                        PolicyDocument:
                            Statement:
                                [
                                    *planner_validate,
                                    *planner_create,
                                    *planner_cleanup,
                                ]
                      - PolicyName: Extra
                        PolicyDocument:
                            Statement:
                                - Effect: Allow
                                  Action: [CloudFormation:DeleteChangeSet]
                                  Resource: { Ref: StackArns }
  expectations:
      rules:
          planner_cleanup_only_deletes_pre_merge_change_sets: FAIL

- name: Planner cannot receive managed policies
  input:
      Resources:
          Planner:
              Properties:
                  ManagedPolicyArns:
                      ['arn:aws:iam::aws:policy/AdministratorAccess']
                  Policies:
                      - PolicyName: PrepareExistingStacks
                        PolicyDocument:
                            Statement:
                                [
                                    *planner_validate,
                                    *planner_create,
                                    *planner_cleanup,
                                ]
  expectations:
      rules:
          planner_cleanup_only_deletes_pre_merge_change_sets: FAIL

- name: Planner cannot receive CloudFormation access from a managed policy resource
  input:
      Resources:
          Planner:
              Properties:
                  Policies:
                      - PolicyName: PrepareExistingStacks
                        PolicyDocument:
                            Statement:
                                [
                                    *planner_validate,
                                    *planner_create,
                                    *planner_cleanup,
                                ]
          ExtraAccess:
              Type: AWS::IAM::ManagedPolicy
              Properties:
                  Roles: [{ Ref: Planner }]
                  PolicyDocument:
                      Statement:
                          - Effect: Allow
                            Action: 'cloudformation:*'
                            Resource: '*'
  expectations:
      rules:
          planner_cleanup_only_deletes_pre_merge_change_sets: FAIL

- name: Planner cannot hide a statement behind a condition function
  input:
      Resources:
          Planner:
              Properties:
                  Policies:
                      - PolicyName: PrepareExistingStacks
                        PolicyDocument:
                            Statement:
                                - *planner_validate
                                - *planner_create
                                - *planner_cleanup
                                - Fn::If:
                                      - IsStaging
                                      - Effect: Allow
                                        Action: cloudformation:ExecuteChangeSet
                                        Resource: '*'
                                      - Ref: AWS::NoValue
  expectations:
      rules:
          planner_cleanup_only_deletes_pre_merge_change_sets: FAIL

- name: Executor rejects differently cased pre-merge execution action
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement:
                                - *executor_change_sets
                                - Effect: Allow
                                  Action: CloudFormation:ExecuteChangeSet
                                  Resource: { Ref: StackArns }
                                  Condition: *pre_merge_names
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Executor rejects differently cased actions in a list
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement:
                                - *executor_change_sets
                                - Effect: Allow
                                  Action:
                                      [
                                          s3:ListBucket,
                                          CLOUDFORMATION:EXECUTECHANGESET,
                                      ]
                                  Resource: { Ref: StackArns }
                                  Condition: *pre_merge_names
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Executor rejects NotAction statements
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement:
                                - *executor_change_sets
                                - Effect: Allow
                                  NotAction: s3:DeleteBucket
                                  Resource: { Ref: StackArns }
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Executor cannot hide execution behind a condition function
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement:
                                - *executor_change_sets
                                - Fn::If:
                                      - HasStagingAuthSecret
                                      - Effect: Allow
                                        Action: cloudformation:ExecuteChangeSet
                                        Resource: { Ref: StackArns }
                                        Condition: *pre_merge_names
                                      - Ref: AWS::NoValue
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Executor cannot receive managed policies
  input:
      Resources:
          Executor:
              Properties:
                  ManagedPolicyArns: [{ Ref: ExtraAccess }]
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement: [*executor_change_sets]
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Executor cannot receive execution from an attached policy resource
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement: [*executor_change_sets]
          ExtraAccess:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: [{ Ref: Executor }]
                  PolicyDocument:
                      Statement:
                          - Effect: Allow
                            Action: cloudformation:ExecuteChangeSet
                            Resource: { Ref: StackArns }
                            Condition: *pre_merge_names
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Executor cannot receive execution from a role policy resource
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement: [*executor_change_sets]
          ExtraAccess:
              Type: AWS::IAM::RolePolicy
              Properties:
                  RoleName: { Ref: Executor }
                  PolicyDocument:
                      Statement:
                          - Effect: Allow
                            Action: '*'
                            Resource: '*'
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Policy resources must use statement lists
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement: [*executor_change_sets]
          ExtraAccess:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: [{ Ref: Executor }]
                  PolicyDocument:
                      Statement:
                          Effect: Allow
                          Action: cloudformation:ExecuteChangeSet
                          Resource: '*'
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: FAIL

- name: Shared stack inspection remains allowed for the executor
  input:
      Resources:
          Executor:
              Properties:
                  Policies:
                      - PolicyName: ExecuteReviewedChanges
                        PolicyDocument:
                            Statement: [*executor_change_sets]
          StackInspection:
              Type: AWS::IAM::Policy
              Properties:
                  Roles: [{ Ref: Planner }, { Ref: Executor }]
                  PolicyDocument:
                      Statement: [*stack_reads, *event_read]
  expectations:
      rules:
          executor_cannot_run_pre_merge_change_sets: PASS
