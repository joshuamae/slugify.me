AWSTemplateFormatVersion: '2010-09-09'

Description: >-
    Static website hosting with private S3 storage, CloudFront HTTPS
    delivery, password-protected staging, and temporary GitHub deployment credentials.

Metadata:
    AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2

Parameters:
    Environment:
        Type: String
        Default: staging
        AllowedValues:
            - staging
            - production
        Description: Whether this stack hosts the password-protected staging or public production website

    StagingAuthSecretArn:
        Type: String
        Default: ''
        AllowedPattern: '^$|^arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
        Description: Staging secret containing authorizationSha256, the SHA-256 digest of the Basic authorization header

    StagingAuthSecretVersionId:
        Type: String
        Default: ''
        AllowedPattern: '^$|^[A-Za-z0-9-]{32,64}$'
        Description: Explicit secret version to deploy, changed on password rotation so CloudFormation updates the function

    GitHubRepository:
        Type: String
        AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
        Description: GitHub repository in OWNER/REPOSITORY format

    GitHubOidcSubjectPrefix:
        Type: String
        Default: ''
        AllowedPattern: '^$|^repo:([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+|[A-Za-z0-9_.-]+@[0-9]+/[A-Za-z0-9_.-]+@[0-9]+)$'
        ConstraintDescription: Use the exact repo prefix from GitHub, with both numeric IDs when present, and no environment suffix or wildcards
        Description: >-
            GitHub sub_claim_prefix, including immutable IDs when enabled.
            Empty preserves legacy repo:OWNER/REPOSITORY trust for existing stacks.

    ExistingOidcProviderArn:
        Type: String
        Default: ''
        AllowedPattern: '^$|^arn:[a-z-]+:iam::[0-9]{12}:oidc-provider/token\.actions\.githubusercontent\.com$'
        Description: Existing GitHub OIDC provider ARN, or empty to create one

    PrimaryDomainName:
        Type: String
        Default: ''
        AllowedPattern: '^$|^(?!-)[a-z0-9-]+(?<!-)(\.(?!-)[a-z0-9-]+(?<!-))+$'
        Description: Optional canonical domain without www, paired with CertificateArn

    CertificateArn:
        Type: String
        Default: ''
        AllowedPattern: '^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[a-f0-9-]+$'
        Description: Issued us-east-1 ACM certificate covering the primary domain and www

Rules:
    StagingRequiresCredentials:
        RuleCondition: !Equals [!Ref Environment, staging]
        Assertions:
            - Assert: !And
                  - !Not [!Equals [!Ref StagingAuthSecretArn, '']]
                  - !Not [!Equals [!Ref StagingAuthSecretVersionId, '']]
              AssertDescription: Staging requires a credential digest secret and an explicit secret version

    CustomDomainRequiresCertificate:
        Assertions:
            - Assert: !Or
                  - !And
                    - !Equals [!Ref PrimaryDomainName, '']
                    - !Equals [!Ref CertificateArn, '']
                  - !And
                    - !Not [!Equals [!Ref PrimaryDomainName, '']]
                    - !Not [!Equals [!Ref CertificateArn, '']]
              AssertDescription: Set both PrimaryDomainName and CertificateArn, or leave both empty

Conditions:
    IsStaging: !Equals [!Ref Environment, staging]

    UseCustomDomain: !And
        - !Not [!Equals [!Ref PrimaryDomainName, '']]
        - !Not [!Equals [!Ref CertificateArn, '']]

    UseExplicitGitHubOidcSubjectPrefix: !Not
        - !Equals
          - !Ref GitHubOidcSubjectPrefix
          - ''

    CreateOidcProvider: !Equals
        - !Ref ExistingOidcProviderArn
        - ''

Resources:
    GitHubOidcProvider:
        Type: AWS::IAM::OIDCProvider
        Condition: CreateOidcProvider
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Metadata:
            com.aws.cloudformation.Context:
                why: Allow GitHub to obtain temporary AWS credentials
                must:
                    - Reuse this identity provider across environments
                    - Preserve the ownership parameter when updating this stack
        Properties:
            Url: https://token.actions.githubusercontent.com
            ClientIdList:
                - sts.amazonaws.com

    SiteBucket:
        Type: AWS::S3::Bucket
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Metadata:
            com.aws.cloudformation.Context:
                why: Store website files and private release archives
                must:
                    - Keep public access blocked
                    - Preserve previous assets needed for rollback
        Properties:
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                IgnorePublicAcls: true
                BlockPublicPolicy: true
                RestrictPublicBuckets: true
            OwnershipControls:
                Rules:
                    - ObjectOwnership: BucketOwnerEnforced
            BucketEncryption:
                ServerSideEncryptionConfiguration:
                    - ServerSideEncryptionByDefault:
                          SSEAlgorithm: AES256
            VersioningConfiguration:
                Status: Enabled
            Tags:
                - Key: Project
                  Value: static-site
                - Key: Environment
                  Value: !Ref Environment

    OriginAccessControl:
        Type: AWS::CloudFront::OriginAccessControl
        Metadata:
            com.aws.cloudformation.Context:
                why: Authenticate CloudFront requests to private S3 storage
                must:
                    - Always sign origin requests
        Properties:
            OriginAccessControlConfig:
                Name: !Sub '${AWS::StackName}-oac'
                OriginAccessControlOriginType: s3
                SigningBehavior: always
                SigningProtocol: sigv4

    PageRewrite:
        Type: AWS::CloudFront::Function
        Metadata:
            com.aws.cloudformation.Context:
                why: Authenticate every staging request before cached content or URL rewriting
                must:
                    - Require valid staging credentials for every path, including assets and discovery files
                    - Keep only a credential digest in deployed code, resolved from a versioned secret
                    - Return 401 with no-store and noindex when staging credentials are absent or invalid
                    - Update this mapping when supported routes change
                    - Preserve errors for missing assets
                    - Redirect every non-primary hostname to the configured primary domain before rewriting paths
                    - Preserve the original path and query parameters on the redirect
        Properties:
            Name: !Sub '${AWS::StackName}-pages'
            AutoPublish: true
            FunctionConfig:
                Comment: Protect staging and map known page URLs to generated HTML files
                Runtime: cloudfront-js-2.0
            FunctionCode: !Sub
                - |
                    var crypto = require('crypto');
                    function handler(event) {
                      var request = event.request;
                      if ("${Environment}" === "staging") {
                        var header = request.headers.authorization;
                        var expected = "${StagingAuthDigest}";
                        var value = header ? header.value : "";
                        var valid = !header || header.multiValue ? false :
                          /^Basic [A-Za-z0-9+/]+={0,2}$/i.test(value) && value.length <= 2048;
                        var actual = crypto.createHash('sha256')
                          .update(valid ? "Basic " + value.slice(6) : "").digest('hex');
                        var difference = 0;
                        for (var i = 0; i < 64; i++) {
                          difference |= actual.charCodeAt(i) ^ expected.charCodeAt(i);
                        }
                        if (!valid || !/^[a-f0-9]{64}$/.test(expected) || difference !== 0) {
                          return {
                            statusCode: 401,
                            statusDescription: "Unauthorized",
                            headers: {
                              'www-authenticate': { value: 'Basic realm="Staging", charset="UTF-8"' },
                              'cache-control': { value: 'private, no-store' },
                              'x-robots-tag': { value: 'noindex' }
                            }
                          };
                        }
                        delete request.headers.authorization;
                      }
                      var primaryDomain = "${PrimaryDomainName}";
                      if (primaryDomain && request.headers.host.value.toLowerCase() !== primaryDomain) {
                        var query = [];
                        Object.keys(request.querystring).forEach(function (key) {
                          var parameter = request.querystring[key];
                          (parameter.multiValue || [parameter]).forEach(function (item) {
                            query.push(key + "=" + item.value);
                          });
                        });
                        var redirectHeaders = {
                            location: {
                              value: "https://" + primaryDomain + request.uri +
                                (query.length ? "?" + query.join("&") : "")
                            }
                        };
                        if ("${Environment}" === "staging") {
                          redirectHeaders['cache-control'] = { value: 'private, no-store' };
                          redirectHeaders['x-robots-tag'] = { value: 'noindex' };
                        }
                        return {
                          statusCode: 301,
                          statusDescription: "Moved Permanently",
                          headers: redirectHeaders
                        };
                      }
                      var path = request.uri.replace(/\/$/, "") || "/";
                      var pages = {
                        "/": "/index.html",
                        "/about": "/about/index.html",
                        "/faq": "/faq/index.html",
                        "/privacy-policy": "/privacy-policy/index.html"
                      };
                      if (Object.prototype.hasOwnProperty.call(pages, path)) {
                        request.uri = pages[path];
                      }
                      return request;
                    }
                - StagingAuthDigest: !If
                      - IsStaging
                      - !Sub '{{resolve:secretsmanager:${StagingAuthSecretArn}:SecretString:authorizationSha256::${StagingAuthSecretVersionId}}}'
                      - ''

    StagingResponseHeaders:
        Type: AWS::CloudFront::ResponseHeadersPolicy
        Condition: IsStaging
        Metadata:
            com.aws.cloudformation.Context:
                why: Keep staging out of search results and browser caches without changing promoted artifacts
                must:
                    - Apply only to staging so production remains indexable
                    - Override origin cache headers for viewers while preserving CloudFront caching
                    - Add noindex and no-store directly to function-generated authentication failures too
        Properties:
            ResponseHeadersPolicyConfig:
                Name: !Sub '${AWS::StackName}-staging-headers'
                CustomHeadersConfig:
                    Items:
                        - Header: X-Robots-Tag
                          Value: noindex
                          Override: true
                        - Header: Cache-Control
                          Value: private, no-store
                          Override: true
                SecurityHeadersConfig:
                    ContentTypeOptions:
                        Override: true
                    FrameOptions:
                        FrameOption: DENY
                        Override: true
                    StrictTransportSecurity:
                        AccessControlMaxAgeSec: 31536000
                        IncludeSubdomains: false
                        Preload: false
                        Override: true
                    ContentSecurityPolicy:
                        ContentSecurityPolicy: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
                        Override: true

    CachePolicy:
        Type: AWS::CloudFront::CachePolicy
        Metadata:
            com.aws.cloudformation.Context:
                why: Let each uploaded file control its cache duration
                must:
                    - Keep the minimum TTL at zero so HTML can revalidate
        Properties:
            CachePolicyConfig:
                Name: !Sub '${AWS::StackName}-cache'
                MinTTL: 0
                DefaultTTL: 0
                MaxTTL: 31536000
                ParametersInCacheKeyAndForwardedToOrigin:
                    EnableAcceptEncodingGzip: true
                    EnableAcceptEncodingBrotli: true
                    CookiesConfig:
                        CookieBehavior: none
                    HeadersConfig:
                        HeaderBehavior: none
                    QueryStringsConfig:
                        QueryStringBehavior: none

    Distribution:
        Type: AWS::CloudFront::Distribution
        Metadata:
            com.aws.cloudformation.Context:
                why: Deliver public production and password-protected staging over HTTPS
                must:
                    - Authenticate staging on viewer-request, including cache hits
                    - Attach indexing and browser cache restrictions only to staging
                    - Keep S3 access authenticated through OAC
                    - Serve only the site prefix from the origin
                    - Preserve errors instead of replacing them with homepage HTML
                    - Attach an issued certificate before changing public DNS
                    - Redirect the CloudFront hostname when a primary domain is configured
        Properties:
            DistributionConfig:
                Enabled: true
                Comment: !Sub '${AWS::StackName} website'
                DefaultRootObject: index.html
                HttpVersion: http2
                IPV6Enabled: true
                Aliases: !If
                    - UseCustomDomain
                    - [!Ref PrimaryDomainName, !Sub 'www.${PrimaryDomainName}']
                    - !Ref AWS::NoValue
                Origins:
                    - Id: site
                      DomainName: !GetAtt SiteBucket.RegionalDomainName
                      OriginPath: /site
                      OriginAccessControlId: !Ref OriginAccessControl
                      S3OriginConfig:
                          OriginAccessIdentity: ''
                DefaultCacheBehavior:
                    TargetOriginId: site
                    ViewerProtocolPolicy: redirect-to-https
                    AllowedMethods:
                        - GET
                        - HEAD
                    CachedMethods:
                        - GET
                        - HEAD
                    Compress: true
                    CachePolicyId: !Ref CachePolicy
                    ResponseHeadersPolicyId: !If
                        - IsStaging
                        - !Ref StagingResponseHeaders
                        - !Ref AWS::NoValue
                    FunctionAssociations:
                        - EventType: viewer-request
                          FunctionARN: !GetAtt PageRewrite.FunctionARN
                CustomErrorResponses:
                    - ErrorCode: 403
                      ErrorCachingMinTTL: 0
                    - ErrorCode: 404
                      ErrorCachingMinTTL: 0
                ViewerCertificate: !If
                    - UseCustomDomain
                    - AcmCertificateArn: !Ref CertificateArn
                      SslSupportMethod: sni-only
                      MinimumProtocolVersion: TLSv1.2_2025
                    - CloudFrontDefaultCertificate: true

    BucketPolicy:
        Type: AWS::S3::BucketPolicy
        Metadata:
            com.aws.cloudformation.Context:
                why: Permit this distribution to read published website files
                must:
                    - Restrict CloudFront access to this distribution
                    - Keep release archives outside the CloudFront allow rule
                    - Deny insecure transport
                    - Require conditional creation for version 1 release archives and manifests
        Properties:
            Bucket: !Ref SiteBucket
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Sid: AllowCloudFrontRead
                      Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: s3:GetObject
                      Resource: !Sub '${SiteBucket.Arn}/site/*'
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
                    - Sid: DenyReleaseOverwrite
                      Effect: Deny
                      Principal: '*'
                      Action: s3:PutObject
                      Resource: !Sub '${SiteBucket.Arn}/releases/v1/*'
                      Condition:
                          'Null':
                              s3:if-none-match: 'true'
                          Bool:
                              s3:ObjectCreationOperation: 'true'
                    - Sid: DenyInsecureTransport
                      Effect: Deny
                      Principal: '*'
                      Action: s3:*
                      Resource:
                          - !GetAtt SiteBucket.Arn
                          - !Sub '${SiteBucket.Arn}/*'
                      Condition:
                          Bool:
                              aws:SecureTransport: 'false'

    DeployRole:
        Type: AWS::IAM::Role
        Metadata:
            com.aws.cloudformation.Context:
                why: Allow GitHub to publish releases using temporary credentials
                must:
                    - Restrict trust to the exact repository and environment
                    - Preserve immutable owner and repository IDs in the GitHub subject prefix when enabled
                    - Keep infrastructure administration outside this role
        Properties:
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Federated: !If
                              - CreateOidcProvider
                              - !Ref GitHubOidcProvider
                              - !Ref ExistingOidcProviderArn
                      Action: sts:AssumeRoleWithWebIdentity
                      Condition:
                          StringEquals:
                              token.actions.githubusercontent.com:aud: sts.amazonaws.com
                              token.actions.githubusercontent.com:sub: !If
                                  - UseExplicitGitHubOidcSubjectPrefix
                                  - !Sub '${GitHubOidcSubjectPrefix}:environment:${Environment}'
                                  - !Sub 'repo:${GitHubRepository}:environment:${Environment}'
            Policies:
                - PolicyName: PublishWebsite
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Sid: ListPublishedFilesAndReleases
                            Effect: Allow
                            Action: s3:ListBucket
                            Resource: !GetAtt SiteBucket.Arn
                            Condition:
                                StringLike:
                                    s3:prefix:
                                        - site/*
                                        - releases/*
                          - Sid: ReadAndUploadFiles
                            Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:GetObjectVersion
                                - s3:PutObject
                            Resource:
                                - !Sub '${SiteBucket.Arn}/site/*'
                                - !Sub '${SiteBucket.Arn}/releases/*'
                          - Sid: RefreshCloudFrontCache
                            Effect: Allow
                            Action:
                                - cloudfront:CreateInvalidation
                                - cloudfront:GetInvalidation
                            Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
    BucketName:
        Description: S3 bucket for website files and release archives
        Value: !Ref SiteBucket

    DistributionId:
        Description: CloudFront distribution identifier
        Value: !Ref Distribution

    SiteUrl:
        Description: Public HTTPS address for this environment
        Value: !If
            - UseCustomDomain
            - !Sub 'https://${PrimaryDomainName}'
            - !Sub 'https://${Distribution.DomainName}'

    CloudFrontUrl:
        Description: CloudFront endpoint for connection testing; redirects when a custom domain is configured
        Value: !Sub 'https://${Distribution.DomainName}'

    DeployRoleArn:
        Description: Role ARN to configure in the GitHub environment
        Value: !GetAtt DeployRole.Arn

    OidcProviderArn:
        Description: Shared GitHub identity provider ARN
        Value: !If
            - CreateOidcProvider
            - !Ref GitHubOidcProvider
            - !Ref ExistingOidcProviderArn
