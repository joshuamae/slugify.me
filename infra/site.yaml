AWSTemplateFormatVersion: '2010-09-09'

Description: >-
    Static website hosting with private S3 storage, CloudFront HTTPS
    delivery, and temporary GitHub deployment credentials.

Metadata:
    AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2

Parameters:
    Environment:
        Type: String
        Default: staging
        AllowedValues:
            - staging
            - production
        Description: Whether this stack hosts the practice or production website

    GitHubRepository:
        Type: String
        AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
        Description: GitHub repository in OWNER/REPOSITORY format

    GitHubOidcSubjectPrefix:
        Type: String
        Default: ''
        AllowedPattern: '^$|^repo:([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+|[A-Za-z0-9_.-]+@[0-9]+/[A-Za-z0-9_.-]+@[0-9]+)$'
        ConstraintDescription: Use the exact repo prefix from GitHub, with both numeric IDs when present, and no environment suffix or wildcards
        Description: >-
            GitHub sub_claim_prefix, including immutable IDs when enabled.
            Empty preserves legacy repo:OWNER/REPOSITORY trust for existing stacks.

    ExistingOidcProviderArn:
        Type: String
        Default: ''
        AllowedPattern: '^$|^arn:[a-z-]+:iam::[0-9]{12}:oidc-provider/token\.actions\.githubusercontent\.com$'
        Description: Existing GitHub OIDC provider ARN, or empty to create one

    PrimaryDomainName:
        Type: String
        Default: ''
        AllowedPattern: '^$|^(?!-)[a-z0-9-]+(?<!-)(\.(?!-)[a-z0-9-]+(?<!-))+$'
        Description: Optional canonical domain without www, paired with CertificateArn

    CertificateArn:
        Type: String
        Default: ''
        AllowedPattern: '^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[a-f0-9-]+$'
        Description: Issued us-east-1 ACM certificate covering the primary domain and www

Rules:
    CustomDomainRequiresCertificate:
        Assertions:
            - Assert: !Or
                  - !And
                    - !Equals [!Ref PrimaryDomainName, '']
                    - !Equals [!Ref CertificateArn, '']
                  - !And
                    - !Not [!Equals [!Ref PrimaryDomainName, '']]
                    - !Not [!Equals [!Ref CertificateArn, '']]
              AssertDescription: Set both PrimaryDomainName and CertificateArn, or leave both empty

Conditions:
    UseCustomDomain: !And
        - !Not [!Equals [!Ref PrimaryDomainName, '']]
        - !Not [!Equals [!Ref CertificateArn, '']]

    UseExplicitGitHubOidcSubjectPrefix: !Not
        - !Equals
          - !Ref GitHubOidcSubjectPrefix
          - ''

    CreateOidcProvider: !Equals
        - !Ref ExistingOidcProviderArn
        - ''

Resources:
    GitHubOidcProvider:
        Type: AWS::IAM::OIDCProvider
        Condition: CreateOidcProvider
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Metadata:
            com.aws.cloudformation.Context:
                why: Allow GitHub to obtain temporary AWS credentials
                must:
                    - Reuse this identity provider across environments
                    - Preserve the ownership parameter when updating this stack
        Properties:
            Url: https://token.actions.githubusercontent.com
            ClientIdList:
                - sts.amazonaws.com

    SiteBucket:
        Type: AWS::S3::Bucket
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Metadata:
            com.aws.cloudformation.Context:
                why: Store website files and private release archives
                must:
                    - Keep public access blocked
                    - Preserve previous assets needed for rollback
        Properties:
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                IgnorePublicAcls: true
                BlockPublicPolicy: true
                RestrictPublicBuckets: true
            OwnershipControls:
                Rules:
                    - ObjectOwnership: BucketOwnerEnforced
            BucketEncryption:
                ServerSideEncryptionConfiguration:
                    - ServerSideEncryptionByDefault:
                          SSEAlgorithm: AES256
            VersioningConfiguration:
                Status: Enabled
            Tags:
                - Key: Project
                  Value: static-site
                - Key: Environment
                  Value: !Ref Environment

    OriginAccessControl:
        Type: AWS::CloudFront::OriginAccessControl
        Metadata:
            com.aws.cloudformation.Context:
                why: Authenticate CloudFront requests to private S3 storage
                must:
                    - Always sign origin requests
        Properties:
            OriginAccessControlConfig:
                Name: !Sub '${AWS::StackName}-oac'
                OriginAccessControlOriginType: s3
                SigningBehavior: always
                SigningProtocol: sigv4

    PageRewrite:
        Type: AWS::CloudFront::Function
        Metadata:
            com.aws.cloudformation.Context:
                why: Map page URLs to the HTML files generated by the build
                must:
                    - Update this mapping when supported routes change
                    - Preserve errors for missing assets
                    - Redirect www to the configured primary domain before rewriting paths
                    - Preserve the original path and query parameters on the redirect
        Properties:
            Name: !Sub '${AWS::StackName}-pages'
            AutoPublish: true
            FunctionConfig:
                Comment: Map known page URLs to generated HTML files
                Runtime: cloudfront-js-2.0
            FunctionCode: !Sub |
                function handler(event) {
                  var request = event.request;
                  var primaryDomain = "${PrimaryDomainName}";
                  if (primaryDomain && request.headers.host.value === "www." + primaryDomain) {
                    var query = [];
                    Object.keys(request.querystring).forEach(function (key) {
                      var parameter = request.querystring[key];
                      (parameter.multiValue || [parameter]).forEach(function (item) {
                        query.push(key + "=" + item.value);
                      });
                    });
                    return {
                      statusCode: 301,
                      statusDescription: "Moved Permanently",
                      headers: {
                        location: {
                          value: "https://" + primaryDomain + request.uri +
                            (query.length ? "?" + query.join("&") : "")
                        }
                      }
                    };
                  }
                  var path = request.uri.replace(/\/$/, "") || "/";
                  var pages = {
                    "/": "/index.html",
                    "/about": "/about/index.html",
                    "/faq": "/faq/index.html",
                    "/privacy-policy": "/privacy-policy/index.html"
                  };
                  if (Object.prototype.hasOwnProperty.call(pages, path)) {
                    request.uri = pages[path];
                  }
                  return request;
                }

    CachePolicy:
        Type: AWS::CloudFront::CachePolicy
        Metadata:
            com.aws.cloudformation.Context:
                why: Let each uploaded file control its cache duration
                must:
                    - Keep the minimum TTL at zero so HTML can revalidate
        Properties:
            CachePolicyConfig:
                Name: !Sub '${AWS::StackName}-cache'
                MinTTL: 0
                DefaultTTL: 0
                MaxTTL: 31536000
                ParametersInCacheKeyAndForwardedToOrigin:
                    EnableAcceptEncodingGzip: true
                    EnableAcceptEncodingBrotli: true
                    CookiesConfig:
                        CookieBehavior: none
                    HeadersConfig:
                        HeaderBehavior: none
                    QueryStringsConfig:
                        QueryStringBehavior: none

    Distribution:
        Type: AWS::CloudFront::Distribution
        Metadata:
            com.aws.cloudformation.Context:
                why: Deliver the website publicly over HTTPS
                must:
                    - Keep S3 access authenticated through OAC
                    - Serve only the site prefix from the origin
                    - Preserve errors instead of replacing them with homepage HTML
                    - Attach an issued certificate before changing public DNS
                    - Keep the CloudFront hostname available for verification and recovery
        Properties:
            DistributionConfig:
                Enabled: true
                Comment: !Sub '${AWS::StackName} website'
                DefaultRootObject: index.html
                HttpVersion: http2
                IPV6Enabled: true
                Aliases: !If
                    - UseCustomDomain
                    - [!Ref PrimaryDomainName, !Sub 'www.${PrimaryDomainName}']
                    - !Ref AWS::NoValue
                Origins:
                    - Id: site
                      DomainName: !GetAtt SiteBucket.RegionalDomainName
                      OriginPath: /site
                      OriginAccessControlId: !Ref OriginAccessControl
                      S3OriginConfig:
                          OriginAccessIdentity: ''
                DefaultCacheBehavior:
                    TargetOriginId: site
                    ViewerProtocolPolicy: redirect-to-https
                    AllowedMethods:
                        - GET
                        - HEAD
                    CachedMethods:
                        - GET
                        - HEAD
                    Compress: true
                    CachePolicyId: !Ref CachePolicy
                    FunctionAssociations:
                        - EventType: viewer-request
                          FunctionARN: !GetAtt PageRewrite.FunctionARN
                CustomErrorResponses:
                    - ErrorCode: 403
                      ErrorCachingMinTTL: 0
                    - ErrorCode: 404
                      ErrorCachingMinTTL: 0
                ViewerCertificate: !If
                    - UseCustomDomain
                    - AcmCertificateArn: !Ref CertificateArn
                      SslSupportMethod: sni-only
                      MinimumProtocolVersion: TLSv1.2_2025
                    - CloudFrontDefaultCertificate: true

    BucketPolicy:
        Type: AWS::S3::BucketPolicy
        Metadata:
            com.aws.cloudformation.Context:
                why: Permit this distribution to read published website files
                must:
                    - Restrict CloudFront access to this distribution
                    - Keep release archives outside the CloudFront allow rule
                    - Deny insecure transport
        Properties:
            Bucket: !Ref SiteBucket
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Sid: AllowCloudFrontRead
                      Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: s3:GetObject
                      Resource: !Sub '${SiteBucket.Arn}/site/*'
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
                    - Sid: DenyInsecureTransport
                      Effect: Deny
                      Principal: '*'
                      Action: s3:*
                      Resource:
                          - !GetAtt SiteBucket.Arn
                          - !Sub '${SiteBucket.Arn}/*'
                      Condition:
                          Bool:
                              aws:SecureTransport: 'false'

    DeployRole:
        Type: AWS::IAM::Role
        Metadata:
            com.aws.cloudformation.Context:
                why: Allow GitHub to publish releases using temporary credentials
                must:
                    - Restrict trust to the exact repository and environment
                    - Preserve immutable owner and repository IDs in the GitHub subject prefix when enabled
                    - Keep infrastructure administration outside this role
        Properties:
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Federated: !If
                              - CreateOidcProvider
                              - !Ref GitHubOidcProvider
                              - !Ref ExistingOidcProviderArn
                      Action: sts:AssumeRoleWithWebIdentity
                      Condition:
                          StringEquals:
                              token.actions.githubusercontent.com:aud: sts.amazonaws.com
                              token.actions.githubusercontent.com:sub: !If
                                  - UseExplicitGitHubOidcSubjectPrefix
                                  - !Sub '${GitHubOidcSubjectPrefix}:environment:${Environment}'
                                  - !Sub 'repo:${GitHubRepository}:environment:${Environment}'
            Policies:
                - PolicyName: PublishWebsite
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Sid: ListPublishedFilesAndReleases
                            Effect: Allow
                            Action: s3:ListBucket
                            Resource: !GetAtt SiteBucket.Arn
                            Condition:
                                StringLike:
                                    s3:prefix:
                                        - site/*
                                        - releases/*
                          - Sid: ReadAndUploadFiles
                            Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:GetObjectVersion
                                - s3:PutObject
                            Resource:
                                - !Sub '${SiteBucket.Arn}/site/*'
                                - !Sub '${SiteBucket.Arn}/releases/*'
                          - Sid: RefreshCloudFrontCache
                            Effect: Allow
                            Action:
                                - cloudfront:CreateInvalidation
                                - cloudfront:GetInvalidation
                            Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
    BucketName:
        Description: S3 bucket for website files and release archives
        Value: !Ref SiteBucket

    DistributionId:
        Description: CloudFront distribution identifier
        Value: !Ref Distribution

    SiteUrl:
        Description: Public HTTPS address for this environment
        Value: !If
            - UseCustomDomain
            - !Sub 'https://${PrimaryDomainName}'
            - !Sub 'https://${Distribution.DomainName}'

    CloudFrontUrl:
        Description: CloudFront HTTPS address for verification before DNS cutover
        Value: !Sub 'https://${Distribution.DomainName}'

    DeployRoleArn:
        Description: Role ARN to configure in the GitHub environment
        Value: !GetAtt DeployRole.Arn

    OidcProviderArn:
        Description: Shared GitHub identity provider ARN
        Value: !If
            - CreateOidcProvider
            - !Ref GitHubOidcProvider
            - !Ref ExistingOidcProviderArn
