# Exercise required policy statements without deploying AWS resources
# Anchors reuse only complete values; each invalid input isolates a regression

- name: KMS allows both required actions with scoped CloudWatch access
  input:
      Resources:
          AlarmKey: &valid_key
              Type: AWS::KMS::Key
              Properties:
                  KeyPolicy:
                      Statement:
                          - Sid: AllowCloudWatchAlarmEncryption
                            Effect: Allow
                            Principal: { Service: 'cloudwatch.amazonaws.com' }
                            Action: [kms:GenerateDataKey, kms:Decrypt]
                            Resource: '*'
                            Condition: &alarm_scope
                                StringEquals:
                                    aws:SourceAccount: { Ref: 'AWS::AccountId' }
                                ArnLike:
                                    aws:SourceArn:
                                        Fn::Sub: 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*'
  expectations:
      rules:
          cloudwatch_key_access_is_scoped: PASS

- name: KMS rejects a missing required statement
  input:
      Resources:
          AlarmKey:
              Type: AWS::KMS::Key
              Properties:
                  KeyPolicy:
                      Statement:
                          - Sid: EnableAccountAdministration
                            Effect: Allow
                            Action: 'kms:*'
                            Resource: '*'
  expectations:
      rules:
          cloudwatch_key_access_is_scoped: FAIL

- name: KMS rejects a renamed required statement
  input:
      Resources:
          AlarmKey:
              Type: AWS::KMS::Key
              Properties:
                  KeyPolicy:
                      Statement:
                          - Sid: RenamedEncryption
                            Effect: Allow
                            Principal: { Service: 'cloudwatch.amazonaws.com' }
                            Action: [kms:GenerateDataKey, kms:Decrypt]
                            Resource: '*'
                            Condition: *alarm_scope
  expectations:
      rules:
          cloudwatch_key_access_is_scoped: FAIL

- name: KMS rejects a denied required statement
  input:
