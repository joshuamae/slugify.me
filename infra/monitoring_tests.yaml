- name: SNS checks every allow statement
  input:
      Resources:
          AlarmTopicPolicy:
              Type: AWS::SNS::TopicPolicy
              Properties:
                  PolicyDocument:
                      Statement:
                          - Sid: AllowCloudWatchAlarms
