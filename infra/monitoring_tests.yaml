- name: Each KMS key must include the required statement
  input:
      Resources:
          ValidKey: *valid_key
          BrokenKey:
              Type: AWS::KMS::Key
              Properties:
                  KeyPolicy:
                      Statement: []
  expectations:
      rules:
          cloudwatch_key_access_is_scoped: FAIL

- name: SNS permits scoped CloudWatch publishing
  input:
      Resources:
          AlarmTopicPolicy: &valid_topic_policy
              Type: AWS::SNS::TopicPolicy
              Properties:
                  PolicyDocument:
                      Statement:
                          - Sid: AllowCloudWatchAlarms
                            Effect: Allow
                            Principal: { Service: 'cloudwatch.amazonaws.com' }
                            Action: 'sns:Publish'
                            Resource: { Ref: AlarmTopic }
                            Condition: *alarm_scope
  expectations:
      rules:
          service_publishing_is_scoped: PASS

- name: SNS rejects an empty statement list
  input:
      Resources:
          AlarmTopicPolicy:
              Type: AWS::SNS::TopicPolicy
              Properties:
                  PolicyDocument:
                      Statement: []
  expectations:
      rules:
          service_publishing_is_scoped: FAIL

